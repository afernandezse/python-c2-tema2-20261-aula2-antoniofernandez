<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ titulo }}</title>
</head>
<body>
  <!-- TODO (ej2b2): Muestra titulo en title y h1. Recorre cursos en una lista
       con nombre en strong y descripcion; incluye el caso sin cursos.
       Usa Jinja2 y el entorno con autoescape de ej2b1. -->

       <h1>{{ titulo }}</h1>
       {% if cursos %}
         <ul>
           {% for curso in cursos %}
             <li><strong>{{ curso.nombre }}</strong>: {{ curso.descripcion }}</li>
           {% endfor %}
         </ul>
       {% else %}
         <p>No hay cursos disponibles.</p>
       {% endif %} 


</body>
</html>
